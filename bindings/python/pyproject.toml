# The Python package on its own, against an STP that is already installed:
#
#   python3 -m pip install ./bindings/python
#
# setup.py compiles the extension stp._core against the installation's headers
# and links its libstp, so this needs a C compiler and the interpreter's
# development headers; pip fetches Cython. README.md says how the installation
# is found. The version is STP's, edited by hand at release time
# (docs/releasing.rst).

[build-system]
requires = ["setuptools>=61", "Cython>=3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stp"
version = "2.4.1"
description = "Python API for the STP constraint solver"
readme = "README.md"
requires-python = ">=3.8"

[project.urls]
Homepage = "https://stp.github.io/"
Source = "https://github.com/stp/stp"

[tool.setuptools]
packages = ["stp"]
