# The Python bindings on their own, against an STP that is already installed:
#
#   python3 -m pip install ./bindings/python
#
# The package is pure Python and loads libstp through ctypes, so one copy
# works under every Python 3, and nothing here builds STP. The version is
# STP's, edited by hand at release time (docs/releasing.rst).

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stp"
version = "2.4.1"
description = "Python bindings for the STP constraint solver"
readme = "README.md"
requires-python = ">=3.6"

[project.urls]
Homepage = "https://stp.github.io/"
Source = "https://github.com/stp/stp"

[tool.setuptools]
packages = ["stp"]
