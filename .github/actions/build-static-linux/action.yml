name: Build a static Linux stp
description: >
  Build a statically linked stp and smoke-test it. The repository, including
  submodules, must already be checked out. Both the CI job that keeps static
  linking working and the release workflow that ships the binary use this, so
  that what gets published is built exactly the way CI builds it.

inputs:
  build-type:
    description: >
      CMAKE_BUILD_TYPE to configure with. Left empty by CI, which wants STP's
      own default of RelWithDebInfo with assertions live. The release workflow
      passes Release: CMakeLists turns ENABLE_ASSERTIONS off only for an exact
      "Release", and a published binary must not be asserting.
    required: false
    default: ''
  werror:
    description: >
      Whether to build with WERROR. On for CI, where a new warning should fail
      the build. Off for the release build, where it would mean a warning
      introduced by the different optimisation level blocks a release that CI
      has already passed.
    required: false
    default: 'ON'

outputs:
  binary:
    description: Path to the static executable, relative to the workspace.
    value: ${{ steps.build.outputs.binary }}

runs:
  using: composite

  steps:

  # No lit and no gtest here: STATICCOMPILE turns BUILD_SHARED_LIBS off, and
  # the top-level CMakeLists forces ENABLE_TESTING off when it is off (the
  # Python bindings and the test harness both want a shared libstp), so a
  # static build has no tests to run. See the smoke test at the end.
  - name: Packages
    shell: bash
    run: |
      sudo apt-get update
      sudo apt-get install -y \
        bison \
        build-essential \
        ccache \
        cmake \
        flex \
        gcc \
        git \
        libboost-program-options-dev \
        libgmp-dev \
        ninja-build \
        zlib1g-dev

  - name: Resolve dependency revisions
    id: deps-key
    shell: bash
    run: ./scripts/deps/cache-key.sh >> "$GITHUB_OUTPUT"

  # A different set of dependencies to the other jobs, and a differently built
  # minisat, so a different key prefix: the key describes their revisions, not
  # which of them are in the tree or how they were configured, and restoring
  # another job's cache would leave a minisat with no static library behind
  # while skipping the step that builds one.
  - name: Restore dependencies
    id: deps-cache
    uses: actions/cache@v4
    with:
      path: |
        deps/install
        deps/minisat
        deps/cms
      key: deps-x86_64-static-cms-${{ steps.deps-key.outputs.key }}

  # A static STP links against libminisat.a, which minisat only produces when
  # built with STATICCOMPILE; its default build installs the shared library
  # alone. setup-cms.sh already builds a static (PIC) CryptoMiniSat in
  # Release, so it needs no such argument.
  - name: Dependencies
    if: steps.deps-cache.outputs.cache-hit != 'true'
    shell: bash
    run: |
      ./scripts/deps/setup-minisat.sh -DSTATICCOMPILE=ON
      ./scripts/deps/setup-cms.sh

  - name: Compiler cache
    uses: actions/cache@v4
    with:
      path: ~/.cache/ccache
      key: ccache-static-${{ github.run_id }}
      restore-keys: ccache-static-

  # CryptoMiniSat is linked in rather than disabled, because UserDefinedFlags
  # makes whichever solver is compiled in the default one, and MiniSat is not
  # what STP should be solving with out of the box. That needs the static GMP
  # archives (libgmp.a, libgmpxx.a) the CryptoMiniSat config asks for, hence
  # libgmp-dev above -- the runner image supplies the shared library but a
  # static link needs the archive.
  #
  # USE_POPCNT is left at its default (on). It emits -mpopcnt, which needs
  # Nehalem/2008 or later -- a safe floor for a release download, and the
  # reason a release binary is not built with anything narrower.
  - name: Configure
    shell: bash
    env:
      BUILD_TYPE: ${{ inputs.build-type }}
      WERROR: ${{ inputs.werror }}
    run: |
      mkdir build
      cd build
      args=()
      if [ -n "$BUILD_TYPE" ]; then
        args+=("-DCMAKE_BUILD_TYPE=$BUILD_TYPE")
      fi
      cmake -DSTATICCOMPILE:BOOL=ON -Dcryptominisat5_DIR:PATH="$GITHUB_WORKSPACE/deps/install/lib/cmake/cryptominisat5" -DWERROR:BOOL="$WERROR" "${args[@]}" -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -G Ninja ..

  # ONLY_SIMPLE, or a runner without Boost, produces stp_simple rather than
  # stp. Report whichever was built so the caller does not have to guess.
  - name: Build
    id: build
    shell: bash
    working-directory: build
    env:
      CCACHE_MAXSIZE: 800M
    run: |
      ccache --zero-stats
      cmake --build . --parallel "$(nproc)"
      ccache --show-stats
      stp=$([ -x ./stp ] && echo stp || echo stp_simple)
      echo "binary=build/$stp" >> "$GITHUB_OUTPUT"

  # Linking is most of the point of this action, but a binary that links and
  # then dies on the first query would still pass, so solve something and
  # check the answer rather than just the exit status. Also assert the
  # executable really is static: if the -static link line quietly stopped
  # taking effect this would otherwise keep passing while testing nothing it
  # exists to test.
  - name: Smoke test
    shell: bash
    working-directory: build
    run: |
      stp="$GITHUB_WORKSPACE/${{ steps.build.outputs.binary }}"
      ls -l "$stp"
      file "$stp"
      if ldd "$stp"; then
        echo "expected a static executable, but it has shared dependencies"
        exit 1
      fi
      # Which solver got compiled in decides which one the binary uses by
      # default, so check it rather than assuming the configure line took.
      # The queries below then run on that default, with no --flag.
      if ! "$stp" --version | grep -q 'USE_CRYPTOMINISAT'; then
        echo "expected CryptoMiniSat to be compiled in; it is not"
        "$stp" --version
        exit 1
      fi
      echo '(set-logic QF_BV)(declare-fun x () (_ BitVec 8))(assert (= x #x2a))(check-sat)' > sat.smt2
      echo '(set-logic QF_BV)(declare-fun x () (_ BitVec 8))(assert (and (= x #x2a) (= x #x2b)))(check-sat)' > unsat.smt2
      for expected in sat unsat; do
        got=$("$stp" "$expected.smt2")
        echo "$expected.smt2: '$got'"
        [ "$got" = "$expected" ] || exit 1
      done

# EOF
