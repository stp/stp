name: Docker image

# Nothing built the two Dockerfiles until this existed, so they could only be
# found broken by someone running the command in the README. That is how the
# CryptoMiniSat pin came to sit four minor releases behind, naming a flag the
# version it pinned had already removed.
#
# Both are a full static build of STP and its solvers, so this is expensive:
# it runs only when the recipe or the dependency machinery it drives changes,
# and on merges to master. workflow_dispatch adds a button for any branch.
#
# The two path lists are duplicated because GitHub Actions rejects YAML
# anchors; keep them in step.
on:
  push:
    branches: [master]
    paths:
      - 'Dockerfile'
      - 'Docker.ubuntu22'
      - '.dockerignore'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'scripts/deps/**'
      - '.github/workflows/docker.yml'
  pull_request:
    paths:
      - 'Dockerfile'
      - 'Docker.ubuntu22'
      - '.dockerignore'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'scripts/deps/**'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  image:
    name: ${{ matrix.file }}
    runs-on: ubuntu-latest
    # The two differ only in base image, so a failure in one is worth seeing
    # beside the other's result rather than instead of it.
    strategy:
      fail-fast: false
      matrix:
        file: [Dockerfile, Docker.ubuntu22]

    steps:
    - uses: actions/checkout@v7

    - name: Build the image
      run: docker build --tag stp-image --file "${{ matrix.file }}" .

    # The image is a single static binary on scratch, with stp as its
    # entrypoint reading a problem on standard input. That is the form the
    # README documents, so it is the form worth checking -- and a solver
    # library that ended up shared rather than linked in would leave a binary
    # that cannot start, which nothing before this point would notice.
    - name: Solve on standard input
      run: |
        printf '%s\n' \
          '(set-logic QF_BV)' \
          '(declare-fun x () (_ BitVec 8))' \
          '(assert (= (bvadd x x) (bvmul (_ bv2 8) x)))' \
          '(check-sat)' \
          '(exit)' | docker run --rm -i stp-image | tee /dev/stderr | grep -qx sat

    # MIT and BSD components require their notices to accompany the binary,
    # and on a scratch image these two files are the only place they can be.
    - name: Check the licence notices are in the image
      run: |
        docker create --name notices stp-image
        docker cp notices:/share/doc/STP ./image-notices
        docker rm notices
        test -s image-notices/LICENSE
        test -s image-notices/LICENSE_COMPONENTS
        echo "ok: LICENSE and LICENSE_COMPONENTS ship with the binary"
