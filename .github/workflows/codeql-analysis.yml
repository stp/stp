name: "CodeQL"

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['cpp', 'python']

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        submodules: 'true'

    # libgmp-dev is CryptoMiniSat's, which setup-cms.sh builds below and this
    # job links; STP itself does not use GMP.
    - name: Packages
      if: matrix.language == 'cpp'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bison \
          build-essential \
          cmake \
          flex \
          git \
          libgmp-dev \
          python3 \
          python3-pip \
          python3-setuptools \
          zlib1g-dev
        # ENABLE_TESTING is a hard configure error without lit, even though
        # this job only builds the tests and never runs them.
        sudo pip3 install -U lit

    # The solver libraries and LibBF are built before CodeQL is
    # initialized, so their compilation is not traced into the database.
    # gtest cannot be handled the same way (tests/CMakeLists.txt compiles
    # it as part of the STP build); it is cloned here and filtered out of
    # the results below.
    #
    # CryptoMiniSat is built shared, unlike everywhere else: this job links CMS
    # and CaDiCaL at the same time, and a static CMS drags its own
    # FetchContent-built libcadical.a onto libstp's link line, where it
    # collides with the CaDiCaL from setup-cadical.sh. A shared
    # libcryptominisat5 resolves that dependency inside the .so and exports no
    # CaDiCaL symbols, so only setup-cadical.sh's copy is linked. Dropping the
    # flag no longer fails at link time -- CMakeLists rejects a static CMS
    # alongside USE_CADICAL outright, and the cms-cadical job in ci.yml covers
    # both halves of that.
    - name: Dependencies
      if: matrix.language == 'cpp'
      run: |
        ./scripts/deps/setup-minisat.sh
        ./scripts/deps/setup-cms.sh -DBUILD_SHARED_LIBS=ON
        ./scripts/deps/setup-cadical.sh
        ./scripts/deps/setup-gtest.sh
        ./scripts/deps/setup-libbf.sh

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}

    # CodeQL only sees C++ code that is actually compiled, so every optional
    # component is switched on: all three backends, the unit tests and the
    # extra tools. MiniSat is deliberately included even though the build
    # and test jobs confine it to the dedicated minisat-only legs -- this is
    # the analysis job, and dropping the backend here would leave its
    # wrappers unanalysed anywhere.
    #
    - name: Build
      if: matrix.language == 'cpp'
      run: |
        mkdir build
        cd build
        cmake \
          -DUSE_MINISAT:BOOL=ON \
          -DUSE_CRYPTOMINISAT:STRING=ON \
          -DUSE_CADICAL:BOOL=ON \
          -DCADICAL_DIR:PATH="$GITHUB_WORKSPACE/deps/cadical" \
          -DENABLE_TESTING:BOOL=ON \
          -DBUILD_EXTRA_TOOLS:BOOL=ON \
          -DPYTHON_EXECUTABLE:PATH="$(which python3)" \
          ..
        make -j"$(nproc)"

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{ matrix.language }}"
        output: sarif-results
        upload: failure-only

    # A CodeQL config's paths-ignore only filters interpreted languages, so
    # vendored code the build compiles (extlib-abc, mimalloc, gtest) has to
    # be dropped from the SARIF instead.
    - name: Filter out third-party code
      uses: advanced-security/filter-sarif@v1
      with:
        patterns: |
          -lib/extlib-abc/**
          -lib/extlib-mimalloc/**
          -lib/extlib-symfpu/**
          -deps/**
        input: sarif-results/${{ matrix.language }}.sarif
        output: sarif-results/${{ matrix.language }}.sarif

    - name: Upload results
      uses: github/codeql-action/upload-sarif@v4
      with:
        category: "/language:${{ matrix.language }}"
        sarif_file: sarif-results/${{ matrix.language }}.sarif
