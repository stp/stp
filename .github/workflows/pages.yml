name: Publish site

# Publishes https://stp.github.io/stp/ -- landing page and manual together,
# one Sphinx build from docs/.
#
# stp.github.io/ is a redirect stub pointing here; this repo holds the only
# copy of the sources. Because the content and the Pages site now live in the
# same repo, a merge to master publishes immediately -- there is no scheduled
# poll and no cross-repo credential to expire.

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'include/stp/stp.h'
      - 'include/stp/stp.hpp'
      - 'lib/Api/**'
      - 'bindings/python/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - '.github/workflows/pages.yml'
  # Build (but do not deploy) on PRs, so a change that breaks the site is
  # caught in review rather than after it is already published.
  pull_request:
    paths:
      - 'docs/**'
      - 'include/stp/stp.h'
      - 'include/stp/stp.hpp'
      - 'lib/Api/**'
      - 'bindings/python/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - run: pip install -r docs/requirements.txt

      - name: Install native documentation dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build bison flex doxygen

      # Autodoc reads inherited methods from the real Cython extension.
      - name: Build the Python API
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_AUTO_DOWNLOAD=ON -DUSE_CRYPTOMINISAT=OFF \
            -DENABLE_PYTHON_API=ON -DPYTHON_EXECUTABLE="$(command -v python)"
          cmake --build build --target stp_python --parallel 2

      # Both Doxygen and Sphinx treat warnings as errors.
      - run: python docs/build.py --build-dir build --output _site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
