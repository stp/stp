# statistics.toml -- the STP 3.x statistics table (see Statistics in stp.hpp).
#
# Generates: the name table behind Statistics::get / stp_statistics_* / stp.Statistics, the tier query,
# and the docs. Names are dotted, stable strings; the 2.x `stp_counter_t` ordinals map onto the
# `bv.*`, `uf.*` and `fp.*` entries below (the `legacy` field). Statistics are never printed by the
# library: the CLI's -s/-t output is produced from this snapshot by tools/stp.
#
# Fields: name, type (uint64 | double | string), tier (stable | expert | diagnostic), legacy (2.x counter), help.

# ---------------------------------------------------------------- times (what -t printed)
[[stat]]
name = "time.total_ms"
type = "double"
tier = "stable"
help = "wall-clock time of the last check, including preprocessing"

[[stat]]
name = "time.simplify_ms"
type = "double"
tier = "stable"
help = "simplification and substitution"

[[stat]]
name = "time.bitblast_ms"
type = "double"
tier = "stable"
help = "bit-blasting (AIG construction)"

[[stat]]
name = "time.cnf_ms"
type = "double"
tier = "stable"
help = "CNF generation"

[[stat]]
name = "time.sat_ms"
type = "double"
tier = "stable"
help = "time inside the SAT backend, summed over refinement rounds"

# ---------------------------------------------------------------- sat / cnf (what -s printed, and the backend's own numbers)
[[stat]]
name = "sat.backend"
type = "string"
tier = "stable"
help = "the backend that ran: cryptominisat | cadical | minisat | simplifying-minisat"

[[stat]]
name = "sat.calls"
type = "uint64"
tier = "stable"
help = "number of SAT solver invocations in the last check (refinement rounds + 1)"

[[stat]]
name = "sat.conflicts"
type = "uint64"
tier = "stable"
help = "conflicts consumed by the last check, summed over invocations (the quantity max-num-confl bounds)"

[[stat]]
name = "sat.decisions"
type = "uint64"
tier = "stable"
help = "decisions, summed"

[[stat]]
name = "sat.propagations"
type = "uint64"
tier = "expert"
help = "propagations, summed"

[[stat]]
name = "cnf.variables"
type = "uint64"
tier = "stable"
help = "CNF variables of the last encoding"

[[stat]]
name = "cnf.clauses"
type = "uint64"
tier = "stable"
help = "CNF clauses of the last encoding"

[[stat]]
name = "aig.nodes"
type = "uint64"
tier = "expert"
help = "AND nodes after bit-blasting (the quantity aig-node-budget bounds)"

[[stat]]
name = "checks.total"
type = "uint64"
tier = "stable"
help = "checks answered by this solver so far"

[[stat]]
name = "checks.bitblasted"
type = "uint64"
tier = "expert"
legacy = "STP_COUNTER_QUERIES_BITBLASTED"
help = "checks that reached bit-blasting (the rest were decided by preprocessing)"

