# kinds.toml -- the single kind table for STP 3.x.
#
# Generates (lib/Api/gen/generate.py): enum class stp::Kind (stp.hpp), enum stp_kind (stp.h),
# stp.Kind (Python), the KindSpec rows (arity, signature, the SMT-LIB spelling the API's
# printer uses), and the named constructors in C (stp_<name>) and C++ (stp::<name>); the
# Python names in `py` are the hand-written package's.
#
# Fields
#   name     the 3.x enumerator
#   id       its value in C, C++ and Python, pinned: never changed or reused; a new kind takes the next
#            (the generator refuses a duplicate or a gap)
#   smtlib   the SMT-LIB 2 spelling the printer emits and the parser accepts
#   c        the named C++ constructor in namespace stp (omitted where a dedicated mk_* function creates it); the C name is
#            stp_ + the same spelling minus any trailing underscore (not_ -> stp_not, and_ -> stp_and, bvadd -> stp_bvadd)
#   py       the Python name(s); operators are listed for information
#   arity    "0", "1", "2", "3", "4", "n>=1", "n>=2"
#   indices  number of integer indices, in SMT-LIB order
#   sig      signature pattern: sort variables in [] (n = width, e/s = FP format, I/E array sorts, T any, D.. domain, C codomain)
#   folds    the manager's construction-time rewrites when simplify = true (representative; the full list is generated
#            from the simplifying factory's rule table)
#   engine   "supported" (default), or the engine limit that makes construction an UNSUPPORTED error
#
# Signature notation: "(A, B) -> R". "BV[n]" is a bit-vector of width n; "FP[e,s]" a float of the given
# format; "RM" a rounding mode; "Array[I,E]"; "Fun[D..,C]".

