# options.toml -- the STP 3.x option registry.
#
# This file is the single source for options. It generates:
#   - enum class stp::Option / enum stp_option (the "stable" tier only) and the by-name tables for every tier;
#   - Options::set/get/info/names/help in C++, the stp_options_* functions in C, Solver.set(**kw) / Options in Python;
#   - the CLI table of tools/stp (every entry's --name, aliases, short form and CLI form), its --help groups and text;
#   - the option reference page of the docs;
#   - the checks registry (the table's defaults against the engine's) and cli-help (the built binary's --help).
#
# The entries began as a transcription of the command line tools/stp/main.cpp registered by hand;
# the binary now registers its command line from this table.
# Exclusions (the CLI's 37 pairs: 6 vanish inside the sat-backend enum, 3 become threads' `requires`, 4 belong to the frontend rows,
# 24 are `excludes` below), implications (`implied_by`/`follows`/`implies`) and build requirements were transcribed from tools/stp/main.cpp.
#
# Schema
#   name        the canonical key: every language and the CLI (--name) use it; lower-case, hyphenated
#   aliases     other CLI spellings accepted for compatibility (the underscore spellings, etc.)
#   short       single-letter CLI form
#   type        bool | int | uint | mode | enum | set | string | path | duration
#               mode is the one tri-state auto|on|off; it also takes
#               1/true and 0/false in any case, unless the row lists `values`, which are then its only spellings
#               set is a set of names (replaces bitmasks); the CLI accepts a comma list, "all" and "none"
#               duration is milliseconds in every API; on the CLI a bare number means seconds, as it always did
#   default     the value when unset; "none" for duration means no limit; an enum whose default is "" takes ""
#               (no choice made) besides its values
#   range       { min, max } for int/uint; an entry that reaches a 32-bit engine field says so here, so that no
#               value it accepts is truncated on the way in
#   values      enum/set members, matched exactly (case included); for a mode, its only spellings
#   sentinel    the documented meaning of a special value (e.g. "-1 = no limit"); every sentinel is explicit
#   tier        stable | expert | experimental | diagnostic
#   settable    anytime | before-first-check | construction; a late set is a recoverable OPTION_TIMING error
#   scope       solver | manager
#   category    grouping for help and docs
#   implied_by  { other-option = value }: the value this entry takes when unset and the other option is true
#   follows     "other-option": when unset, takes the value given to the named option (composite switches)
#   negation    the --no-<name> CLI spelling that sets a bool entry to false
#   latched_by  "other-option": while that bool option is true, this entry behaves as before-first-check
#   latch_note  why an entry is before-first-check (the engine site that latches it)
#   implies     for composite switches: what setting this entry writes elsewhere
#   excludes    entries that may not be set together (checked at resolve(), OPTION_CONFLICT)
#   requires    { build = "cadical" | "highs" | "highs-cut-log" | "cryptominisat" | "minisat", option = "...", value = "..." }:
#               OPTION_UNAVAILABLE in other builds; OPTION_CONFLICT when the named option does not hold the value; info().supported = false
#   cli_form    how tools/stp registers the entry: value (the default: --name VALUE, or --name=VALUE), flag (a bare
#               --name, with an optional =VALUE; a mode flag reads bare as on) or none (API only, not on the CLI)
#   cli_bad_value  the line tools/stp prints for a value it refuses, where it differs from the generic
#               "ERROR: --name must be one of ..." form: {name} the entry, {value} the text given, {member} the
#               member of a set the registry refused, {expected} the row's values as "a, b, or c". It words the
#               registry's own refusal of a value or member; an applier's or engine parser's refusal keeps its
#               own wording
#   cli_below_min, cli_above_max  the line tools/stp prints for a number outside `range`, where it differs from
#               the generic "ERROR: --name must be <min> or greater" / "ERROR: --name must be at most <max>"
#   cli_range   { min, max }: the window the command line checks itself (CLI11) where it is narrower than `range`,
#               for an entry whose API sentinel (-1 = unset) the CLI never accepted
#   cli_take_last  a repeated --name takes its last value (bool and lenient mode entries always do); otherwise
#               CLI11 refuses the repetition
#   cli_empty   "unset": an empty value on the command line leaves the entry unset, as if it was not given
#   help        shown by --help and info(); the CLI text, so it may run to several sentences
#
# [[cli_group]] and [[category]] give the --help groups of tools/stp; [[alias]] the bare flags that set another
# entry to a value; [[frontend]] the CLI-only registrations (see each section).

# ============================================================================ new in 3.x

[[option]]
name = "produce-models"
type = "bool"
default = true
tier = "stable"
settable = "anytime"
scope = "solver"
engine = { custom = "produce_models" }
category = "model"
help = "build a model on sat so that Solver::model() is available; off saves the model construction for truth-only clients"

[[option]]
name = "sat-backend"
type = "enum"
default = "auto"
values = ["auto", "cryptominisat", "cadical", "minisat", "simplifying-minisat"]
tier = "stable"
settable = "construction"
scope = "solver"
engine = { custom = "sat_backend" }
category = "sat"
requires = { build = "the named backend; auto picks the first available of cryptominisat, cadical, minisat" }
help = "the SAT backend; one this build lacks is a recoverable OPTION_UNAVAILABLE when a solver is made with it, never exit(-1) at solve time"

[[option]]
name = "random-seed"
type = "uint"
default = 0
tier = "stable"
settable = "before-first-check"
scope = "solver"
engine = { custom = "random_seed" }
category = "sat"
help = "seed for every randomised component (SAT backend, phase and decision heuristics)"

[[option]]
name = "model-array-fill"
type = "enum"
cli_form = "none"
default = "zero"
values = ["zero", "ones"]
tier = "stable"
settable = "anytime"
scope = "solver"
engine = { custom = "model_array_fill" }
category = "model"
help = "the element every reader and printer reports for an array cell the model never observed: zero (SMT-LIB (as const) printing) or ones (every bit set, the completion KLEE's .ktest bytes depend on)"

[[option]]
name = "stop-after-cnf"
type = "bool"
cli_form = "flag"
default = false
tier = "expert"
settable = "anytime"
scope = "solver"
engine = { field = "stop_after_cnf" }
category = "cnf"
# not tools/stp's --exit-after-CNF: that spelling is a frontend row, and it sets end-after-cnf
help = "stop the check after CNF generation and answer unknown (STOPPED_AFTER_CNF)"

[[option]]
name = "end-after-cnf"
type = "bool"
cli_form = "none"
default = false
tier = "expert"
settable = "anytime"
scope = "solver"
engine = { field = "exit_after_CNF" }
category = "cnf"
# tools/stp's --exit-after-CNF (a frontend row) sets this entry: the run ends where the command line always stopped
help = "end the run at the first CNF a check generates: the check stops there and says nothing more (print-quickstat's report and a partial CNF's warning come first), and an input read with ParseMode::EXECUTE ends with it; a check answers unknown (STOPPED_AFTER_CNF)"

[[option]]
name = "logic"
type = "string"
default = ""
tier = "stable"
settable = "before-first-check"
scope = "solver"
engine = { custom = "logic" }
category = "frontend"
implies = "QF_UF*/QF_AUF* -> uninterpreted-functions=on; QF_AX -> array-equality=on; QF_BV/QF_ABV -> the 32-check engagement policy; QF_LRA -> every check Real-active (set-logic's side effects, visible through Options::resolved)"
help = "the SMT-LIB logic; the same entry (set-logic) writes when a script is parsed"

[[option]]
name = "simplify"
type = "bool"
default = true
tier = "stable"
settable = "construction"
scope = "manager"
engine = { custom = "manager_simplify" }
category = "manager"
help = "construction-time folding by the term manager (the normal form in kinds.toml); false builds terms faithfully"

[[option]]
name = "default-rounding-mode"
type = "enum"
cli_form = "none"
default = "RNE"
values = ["RNE", "RNA", "RTP", "RTN", "RTZ"]
tier = "stable"
settable = "anytime"
scope = "manager"
engine = { custom = "manager_default_rounding_mode" }
category = "manager"
help = "the rounding mode FP operators use when none is given (C++ and Python operator sugar); the printer always prints it"

