settable = "before-first-check"
scope = "solver"
engine = { field = "bv_eq_abstraction" }
category = "refinement.bv"
latch_note = "a blast-time switch: under the incremental driver a change would reach only pieces encoded afterwards, so it is frozen at the first check (mixing would be sound but silent)"
help = "replace wide BV equalities -- whatever their operands; the bit-blaster proxies non-input ones -- with fresh Boolean variables during bit-blasting, refining lazily via CEGAR"

[[option]]
name = "bv-eq-abstraction-constant-side"
type = "bool"
default = false
tier = "expert"
settable = "before-first-check"
scope = "solver"
engine = { field = "bv_eq_abstraction_constant_side" }
category = "refinement.bv"
latch_note = "a blast-time switch: under the incremental driver a change would reach only pieces encoded afterwards, so it is frozen at the first check (mixing would be sound but silent)"
help = "abstract an equality one side of which the blast knows entirely; off by default, such an equality is lowered exactly, since a comparison against a constant is one AND over the term's bits, where a record is a free Boolean the refinement pins a round at a time"

[[option]]
name = "bv-abstraction-width"
type = "uint"
default = 64
range = { max = 4294967295 }
tier = "expert"
settable = "before-first-check"
scope = "solver"
engine = { field = "bv_abstraction_width" }
category = "refinement.bv"
latch_note = "a blast-time switch: under the incremental driver a change would reach only pieces encoded afterwards, so it is frozen at the first check (mixing would be sound but silent)"
help = "minimum operand width at which --bv-eq-abstraction and --bv-term-abstraction abstract an operation"

[[option]]
name = "bv-eq-refine-width"
type = "uint"
default = 0
range = { max = 4294967295 }
tier = "expert"
settable = "anytime"
scope = "solver"
engine = { field = "bv_eq_refine_width" }
category = "refinement.bv"
help = "initial prefix width for lazy BV equality refinement (0 = full)"

[[option]]
name = "bv-term-abstraction"
type = "bool"
default = false
tier = "stable"
settable = "before-first-check"
scope = "solver"
engine = { field = "bv_term_abstraction" }
category = "refinement.bv"
latch_note = "a blast-time switch: under the incremental driver a change would reach only pieces encoded afterwards, so it is frozen at the first check (mixing would be sound but silent)"
help = "abstract wide BVMULT, BVDIV and BVMOD during bit-blasting, refining lazily via CEGAR; the three options below add the cheaper kinds"

[[option]]
name = "bv-term-abstraction-ite"
type = "bool"
default = false
tier = "expert"
settable = "before-first-check"
scope = "solver"
engine = { field = "bv_term_abstraction_ite" }
category = "refinement.bv"
latch_note = "a blast-time switch: under the incremental driver a change would reach only pieces encoded afterwards, so it is frozen at the first check (mixing would be sound but silent)"
help = "also abstract wide if-then-else (off: it is noise on bit-vector workloads and the whole benefit on floating-point ones)"

[[option]]
name = "bv-term-abstraction-plus"
type = "bool"
default = false
tier = "expert"
settable = "before-first-check"
scope = "solver"
engine = { field = "bv_term_abstraction_plus" }
category = "refinement.bv"
latch_note = "a blast-time switch: under the incremental driver a change would reach only pieces encoded afterwards, so it is frozen at the first check (mixing would be sound but silent)"
help = "also abstract wide BVPLUS (off, for the same reason)"

[[option]]
name = "bv-term-abstraction-compare"
type = "bool"
default = false
tier = "expert"
settable = "before-first-check"
scope = "solver"
engine = { field = "bv_term_abstraction_compare" }
category = "refinement.bv"
latch_note = "a blast-time switch: under the incremental driver a change would reach only pieces encoded afterwards, so it is frozen at the first check (mixing would be sound but silent)"
help = "also abstract wide inequalities (off, for the same reason)"

[[option]]
name = "array-index-hints"
type = "enum"
default = "off"
values = ["off", "phase", "decide"]
cli_take_last = true
tier = "expert"
settable = "anytime"
scope = "solver"
engine = { custom = "array_index_hints" }
category = "arrays"
help = "seed the free indices of each array's reads apart before the first solve, so that fewer candidates collide two reads on one index: 'off' (the default), 'phase' (suggest a counting value per index), or 'decide' (also decide those bits first, through cadical's external propagator; other backends get the phases)"

[[option]]
name = "congruence-candidates"
type = "bool"
default = false
tier = "experimental"
settable = "anytime"
scope = "solver"
engine = { field = "enable_congruence_candidates" }
category = "refinement.uf"
help = "prove equalities between terms the query applies the same operator to in the same position, and assert the ones that hold, so the two applications and everything built on them collapse into one instead of being bit-blasted twice"

[[option]]
name = "congruence-candidate-limit"
type = "int"
default = 64
tier = "experimental"
settable = "anytime"
scope = "solver"
engine = { field = "congruence_candidate_limit" }
category = "refinement.uf"
help = "how many candidate equalities may be put to the solver. Each is its own small query, so this is what the pass costs on a query where nothing turns out to be equal"

[[option]]
name = "congruence-candidate-conflicts"
type = "int"
default = 20000
sentinel = "<0 = unbounded"
tier = "experimental"
settable = "anytime"
scope = "solver"
engine = { field = "congruence_candidate_conflicts" }
category = "refinement.uf"
help = "conflicts one candidate may take before it is dropped undecided; a candidate needing more than this to settle is not one whose proof pays for itself. Negative removes the budget"

[[option]]
name = "skeleton-preproc"
type = "bool"
default = false
tier = "expert"
settable = "anytime"
scope = "solver"
engine = { field = "skeleton_preproc" }
category = "refinement.uf"
help = "ask the query's propositional skeleton what it forces, and assert that before solving"

[[option]]
name = "embedded-constraints"
type = "bool"
default = false
tier = "experimental"
settable = "anytime"
scope = "solver"
engine = { field = "embedded_constraints" }
category = "refinement.uf"
help = "replace an assertion where it occurs inside another assertion"

[[option]]
name = "bv-term-abstraction-mult"
type = "bool"
default = true
tier = "expert"
settable = "before-first-check"
scope = "solver"
engine = { field = "bv_term_abstraction_mult" }
category = "refinement.bv"
latch_note = "a blast-time switch: under the incremental driver a change would reach only pieces encoded afterwards, so it is frozen at the first check (mixing would be sound but silent)"
help = "scope for BVMULT, and for BVDIV and BVMOD unless the separate DIV/MOD option is also given, which overrides them in either order"

[[option]]
name = "bv-term-abstraction-divmod"
type = "bool"
default = true
tier = "expert"
settable = "before-first-check"
scope = "solver"
engine = { custom = "bv_term_abstraction_divmod" }
category = "refinement.bv"
follows = "bv-term-abstraction-mult"   # when unset, takes the value given to bv-term-abstraction-mult (main.cpp:1807-1811)
latch_note = "a blast-time switch: under the incremental driver a change would reach only pieces encoded afterwards, so it is frozen at the first check (mixing would be sound but silent)"
help = "independently override whether BVDIV and BVMOD are abstracted; turning it off leaves division and remainder encoded exactly from the start"

[[option]]
name = "bv-term-abstraction-schemas"
type = "bool"
default = true
tier = "expert"
settable = "anytime"
scope = "solver"
engine = { field = "bv_term_abstraction_schemas" }
category = "refinement.bv"
help = "refine abstracted BVPLUS, BVMULT, BVDIV and BVMOD operations with algebraic facts that hold for every pair of operands before their operation-specific fallback"

[[option]]
name = "bv-term-abstraction-schema-groups"
type = "set"
default = ["base", "urem", "mul-ref3"]
sentinel = "default = the qualified profile (BV_SCHEMA_GROUP_QUALIFIED); udiv/mul6/quotient-one/divrem-identity are aliases for group subsets; all/none must stand alone"
tier = "expert"
settable = "anytime"
scope = "solver"
engine = { custom = "bv_term_abstraction_schema_groups" }
category = "refinement.bv"
values = ["base", "udiv15", "udiv-observed", "udiv-tail", "urem", "quotient-one-quot", "quotient-one-rem", "quotient-thresholds", "divisor-magnitude", "divrem-full", "mul8", "mul-ref3", "mul-tail", "add", "low-prefix", "udiv", "mul6", "quotient-one", "divrem-identity", "all", "none"]
help = "comma-separated schema families allowed by --bv-term-abstraction-schemas: base, udiv15, udiv-observed, udiv-tail, urem, mul8, mul-ref3, mul-tail, add, quotient-thresholds, low-prefix, quotient-one-rem, quotient-one-quot, divisor-magnitude, or divrem-full; 'all' selects the complete experimental stack and 'none' selects no schemas; semantic aliases are udiv, mul6, quotient-one and divrem-identity"

[[option]]
name = "bv-term-abstraction-rounds"
type = "uint"
default = 32
range = { max = 4294967295 }
tier = "expert"
settable = "anytime"
scope = "solver"
engine = { custom = "bv_term_abstraction_rounds" }
category = "refinement.bv"
help = "ceiling on the blocking lemmas one abstracted BVMULT/BVDIV/BVMOD may take before its refinement encodes the operation exactly instead of enumerating further operand pairs (0: never; enumerate without limit)"

[[option]]
name = "bv-term-abstraction-profile"
type = "enum"
default = ""
values = ["qualified", "broad", "aggressive"]
tier = "expert"
settable = "anytime"
scope = "solver"
engine = { custom = "bv_term_abstraction_profile" }
category = "refinement.bv"
sentinel = "unset = no profile: the schema-groups and rounds entries apply"
excludes = ["bv-term-abstraction-schema-groups", "bv-term-abstraction-rounds"]
cli_bad_value = "ERROR: --{name}: unknown BV term-abstraction profile '{value}'; expected qualified, broad, or aggressive"
help = "apply an atomic schema-mask/round pair: 'qualified' is the inherited base, UREM and MulRef3 mask at 32 rounds; 'broad' adds the observed UDIV and MUL8 facts, divisor-magnitude and quotient-one facts at 16 rounds but no paired DIV/REM relation; 'aggressive' adds the full-width paired DIV/REM identity to that"

[[option]]
name = "bv-term-abstraction-value-divisor"
type = "uint"
default = 0
range = { max = 4294967295 }
tier = "expert"
settable = "anytime"
scope = "solver"
engine = { field = "bv_term_abstraction_value_divisor" }
category = "refinement.bv"
help = "scale that allowance with the operand width, as width/divisor floored at one and capped by the ceiling above; a blocking lemma rules out one pair of operand values, so what one is worth falls away as the operands widen (0, the default: do not scale, which measured no slower and no faster)"

[[option]]
name = "bv-term-abstraction-constant-operands"
type = "bool"
default = true
tier = "expert"
settable = "before-first-check"
scope = "solver"
engine = { field = "bv_term_abstraction_constant_operands" }
category = "refinement.bv"
latch_note = "a blast-time switch: under the incremental driver a change would reach only pieces encoded afterwards, so it is frozen at the first check (mixing would be sound but silent)"
help = "abstract a multiplication one of whose operands the blast knows entirely, or a division or remainder by such a divisor (on by default); declined, such an operation is lowered exactly, since the constant's shift-and-add propagates where a record spends a round per candidate before escalating to it"

[[option]]
name = "bv-term-abstraction-constant-operand-limit"
type = "uint"
default = 1
range = { max = 4294967295 }
tier = "expert"
settable = "anytime"
scope = "solver"
engine = { field = "bv_term_abstraction_constant_operand_limit" }
category = "refinement.bv"
help = "cap on value-pair blocking rounds for an abstracted multiplication, division or remainder one of whose operands is a constant, whose exact encoding is a constant's shift-and-add (0: no cap)"

[[option]]
name = "bv-term-abstraction-divmod-value-limit"
type = "uint"
default = 0
range = { max = 4294967295 }
tier = "experimental"
settable = "anytime"
scope = "solver"
engine = { field = "bv_term_abstraction_divmod_value_limit" }
category = "refinement.bv"
help = "independent cap on BVDIV/BVMOD value-pair blocking after the round ceiling and optional width scaling; unlike --rounds this changes neither the algebraic-schema budget nor BVMULT (0, the default: no additional cap)"

[[option]]
name = "bv-term-abstraction-inc-bitblast"
type = "bool"
default = false
tier = "experimental"
settable = "anytime"
scope = "solver"
engine = { field = "bv_term_abstraction_inc_bitblast" }
category = "refinement.bv"
help = "escalate an abstracted BVMULT a piece at a time: encode the bits up to and a little past the lowest one the candidate got wrong, rather than the whole width at once"

[[option]]
name = "incremental-piece-rewriting"
type = "bool"
default = false
tier = "expert"
settable = "before-first-check"
scope = "solver"
engine = { field = "incremental_piece_rewriting" }
category = "incremental"
help = "run the batch pipeline's rewriting passes -- strength reduction over a derived interval domain, and common sub-sum extraction -- on each piece the incremental driver prepares; each is a function of its piece alone, so the result caches and the encoding built from it stays valid"

[[option]]
name = "incremental-scoped-preprocessing"
type = "bool"
default = false
tier = "expert"
settable = "anytime"
scope = "solver"
engine = { field = "incremental_scoped_preprocessing" }
category = "incremental"
help = "offer the whole active stack to the exact-stack preprocessor on every incremental check rather than only on a forced first engagement, and offer it stacks carrying array reads and floating point rather than plain bit-vectors alone"

[[option]]
name = "uninterpreted-functions"
type = "mode"
cli_form = "flag"
default = "auto"
tier = "stable"
settable = "before-first-check"
scope = "solver"
engine = { custom = "enable_uninterpreted_functions" }
category = "refinement.uf"
# Array equalities and UF applications are always constructible; this entry only forces the theory machinery on
# or off, and auto engages it when the assertions contain array equalities / UF applications
help = "decide uninterpreted functions over Bool, bit-vector, RoundingMode and floating-point sorts by dynamic Ackermann refinement, including when the input logic omits UF"

[[option]]
name = "uf-lemmas-per-round"
type = "uint"
default = 0
range = { max = 4294967295 }
tier = "expert"
settable = "anytime"
scope = "solver"
engine = { field = "uf_lemmas_per_round" }
category = "refinement.uf"
sentinel = "0 = unlimited"
help = "how many congruence lemmas one refuted candidate may install (0: every conflict it exposes; 1: one conflict per round)"

[[option]]
name = "uf-ackermann"
type = "mode"
default = "auto"
values = ["on", "off", "auto"]
tier = "stable"
settable = "anytime"
scope = "solver"
engine = { custom = "uf_ackermann" }
category = "refinement.uf"
help = "whether to install a function's pairwise congruence constraints before the first solve: 'on' (every declaration), 'off' (none, so a candidate has to earn each lemma), or 'auto' (the default: the declarations whose pair count fits the budget, cheapest first)"

[[option]]
name = "uf-ackermann-budget"
type = "uint"
default = 256
range = { max = 4294967295 }
tier = "expert"
settable = "anytime"
scope = "solver"
engine = { field = "uf_eager_budget" }
category = "refinement.uf"
help = "how many congruence constraints --uf-ackermann=auto may install up front"

[[option]]
name = "uf-lazy-in-place"
type = "bool"
default = true
tier = "expert"
settable = "anytime"
scope = "solver"
engine = { field = "uf_lazy_in_place" }
category = "refinement.uf"
help = "whether a lazy congruence round extends the running solve in place, keeping the SAT solver, rather than starting a new one"

[[option]]
name = "uf-lazy-full-expansion-pairs"
type = "uint"
default = 256
range = { max = 4294967295 }
tier = "expert"
settable = "anytime"
scope = "solver"
engine = { field = "uf_lazy_full_expansion_pairs" }
category = "refinement.uf"
help = "cap on n(n-1)/2 at which a persistently-breaking UF declaration is fully Ackermannised; larger functions stay lazy (0 never full-expands)"

[[option]]
name = "uf-lazy-round-limit"
type = "uint"
default = 8
range = { max = 4294967295 }
tier = "expert"
settable = "anytime"
scope = "solver"
engine = { field = "uf_lazy_round_limit" }
category = "refinement.uf"
help = "how many rounds a lazily-decided Real function may keep breaking congruence before every pair it has left is stated at once"

[[option]]
name = "uf-congruence-closure"
type = "mode"
default = "auto"
tier = "expert"
settable = "anytime"
scope = "solver"
engine = { field = "uf_congruence_closure" }
category = "refinement.uf"
help = "when a large function keeps breaking congruence past the round limit -- too large for the full-expansion fallback, so otherwise purely lazy -- escalate it to a transitive closure over the model, which states the congruences a nested equality will break next round instead of re-discovering them one round at a time; every lemma is still a congruence axiom, so answers do not change; on escalates every large stuck function, auto only those with at least --uf-congruence-closure-min-apps applications"

[[option]]
name = "uf-congruence-closure-min-apps"
type = "uint"
default = 400
range = { max = 4294967295 }
tier = "expert"
settable = "anytime"
scope = "solver"
engine = { field = "uf_congruence_closure_min_apps" }
category = "refinement.uf"
help = "in auto mode, the least applications a UF function must have before its congruence is escalated to the closure; the files the closure helps carry a function of many hundreds of applications, so this keeps auto off the medium functions where escalating only adds overhead"

[[option]]
name = "array-ackermann-budget"
type = "uint"
default = 4000
range = { max = 4294967295 }
tier = "expert"
settable = "anytime"
scope = "solver"
engine = { field = "array_eager_budget" }
category = "arrays"
help = "how many index comparisons eager array Ackermannisation may introduce before read refinement is preferred; 0 selects it only when asked for by name"

[[option]]
name = "uf-phase-hints"
type = "bool"
default = true
tier = "expert"
settable = "anytime"
scope = "solver"
engine = { field = "uf_phase_hints" }
category = "refinement.uf"
help = "bias the first candidate so the congruence checker's scalars start out pairwise different (advisory; affects search order only)"

[[option]]
name = "uf-check-during-bv-refinement"
type = "bool"
default = true
tier = "expert"
settable = "anytime"
scope = "solver"
engine = { field = "uf_check_during_bv_refinement" }
category = "refinement.uf"
help = "run the congruence checker on a candidate the bit-vector abstraction has just refined as well, so its lemmas go in beside the abstraction's rather than after the abstraction is faithful"

[[option]]
name = "uf-sort-width"
type = "uint"
default = 16
range = { min = 1, max = 1024 }
tier = "stable"
settable = "construction"
scope = "manager"
engine = { custom = "manager_uf_sort_width" }
category = "refinement.uf"
help = "bit-vector width given to a sort introduced by (declare-sort S 0); it bounds how many elements of that sort a query can tell apart, so a larger value is always sound and only a smaller one is not"

[[option]]
name = "uf-narrow-results"
type = "bool"
default = true
tier = "expert"
settable = "anytime"
scope = "solver"
engine = { field = "uf_narrow_results" }
category = "refinement.uf"
help = "narrow UF result sorts whose applications are used only for equality to ceil(log2(N+1)) bits, cutting the AIG cost of each congruence constraint from O(width) to O(log N)"

[[option]]
name = "uf-propagate-equalities"
type = "mode"
default = "auto"
tier = "expert"
settable = "anytime"
scope = "solver"
engine = { field = "uf_propagate_equalities" }
category = "refinement.uf"
help = "before lowering, rewrite the query under its own top-level equalities with applications still in place, so that `x = y` merges (f x) and (f y) into one application and `a = (f y)` or `(f 3) = 0` reach the terms built on a or (f 3); auto runs it unless the query has Real content, where it measures as a loss"

[[option]]
name = "uf-skeleton-preproc"
type = "mode"
default = "auto"
tier = "expert"
settable = "anytime"
scope = "solver"
engine = { field = "uf_skeleton_preproc" }
category = "refinement.uf"
help = "let --uf-propagate-equalities also read the facts the query's Boolean skeleton forces, so an equality stated under an implication the structure resolves still crosses the applications; one SAT call over the skeleton per UF solve, and auto follows the pass it feeds"

[[option]]
name = "uf-bv-term-abstraction"
type = "mode"
default = "auto"
values = ["on", "off", "auto"]
tier = "expert"
settable = "anytime"
scope = "solver"
engine = { custom = "uf_bv_term_abstraction" }
category = "refinement.uf"
