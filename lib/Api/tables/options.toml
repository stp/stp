engine = { field = "multiplication_lemmas" }
category = "bitblast"
help = "conjoin to each multiply the low-bit residue implicates its circuit cannot propagate: 0 (default) none, 3 the six clauses that make the 3-bit relation refutation-complete, 4 the 88 for 4 bits"

