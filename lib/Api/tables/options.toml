category = "fp-abstraction"
implied_by = { "bv-term-abstraction" = 128 }
help = "packed width at or above which releasing a multiplication, division, square root, fma or remainder exactly runs the whole pipeline again with it lowered exactly, so that the bit-vector abstraction can see its circuit, instead of splicing the circuit into the running solver; 0 never restarts, and is the default unless --bv-term-abstraction is on, which sets 128"

[[option]]
name = "fp-abstraction-constant-operands"
type = "mode"
default = "auto"
values = ["on", "off", "auto"]
tier = "expert"
settable = "anytime"
scope = "solver"
engine = { custom = "fp_abstraction_constant_operands" }
category = "fp-abstraction"
help = "whether an operation one of whose float operands is a constant is abstracted: 'auto' (the default) does so when the configuration abstracts an operation of two operands it does not know or one whose operand is another abstracted operation, 'on' and 'off' decide it for every query. Declined, such an operation is lowered exactly, since a constant's circuit is small and propagates where the abstraction would have the solver search -- which wins on queries that only scale their unknowns and loses on those that compute with them"

[[option]]
name = "fp-abstraction-decline-pinned"
type = "bool"
cli_form = "flag"
default = false
tier = "expert"
settable = "anytime"
scope = "solver"
engine = { field = "fp_abstraction_decline_pinned" }
category = "fp-abstraction"
help = "leave exact any operation whose result the query equates directly with a constant or a conversion -- the witness-hunt signature, where the solve must produce the exact value anyway and a surrogate only defers the circuit"

[[option]]
name = "fp-abstraction-budget"
type = "uint"
default = 0
range = { max = 4294967295 }
sentinel = "seconds"
tier = "expert"
settable = "anytime"
scope = "solver"
engine = { field = "fp_abstraction_budget" }
category = "fp-abstraction"
help = "wall-clock seconds after which a batch refinement releases every remaining record exactly, spliced in place, bounding a loss near the budget instead of the timeout; 0 never"

[[option]]
name = "bb.fp-native-domain"
type = "bool"
default = true
tier = "expert"
settable = "before-first-check"
scope = "solver"
engine = { field = "fp_native_domain" }
category = "bitblast"
help = "Mine simple finite box bounds and omit NaN/infinity cases that are impossible under those top-level facts (enabled by default)"

[[option]]
name = "bb.fp-native-known-sign"
type = "bool"
default = false
tier = "experimental"
settable = "before-first-check"
scope = "solver"
engine = { field = "fp_native_known_sign" }
category = "bitblast"
help = "Use finite semantic-sign facts in native fp.add/fp.mul to omit opposite-sign/sign-dependent circuitry while preserving signed zero (experimental; requires --bb.fp-native-domain)"

[[option]]
name = "fp-domain-simplify"
type = "bool"
default = false
tier = "experimental"
settable = "before-first-check"
scope = "solver"
engine = { field = "fp_domain_simplify" }
category = "bitblast"
help = "Experimental FP prepass: mine boxed variable bounds, use boxed FP domain facts, and discharge ordered FP comparisons or zero-sum rows decided by those facts"

[[option]]
name = "fp-domain-derived-bounds"
type = "bool"
default = true
tier = "expert"
settable = "before-first-check"
scope = "solver"
engine = { field = "fp_domain_derived_bounds" }
category = "bitblast"
help = "Decision-only FP prepass (enabled by default): derive finite symbol bounds from top-level symbol/expression relations and zero-result additions, then discharge comparisons or contradictory boxes"

[[option]]
name = "fp-domain-extremal-selectors"
type = "bool"
default = true
tier = "expert"
settable = "before-first-check"
scope = "solver"
engine = { field = "fp_domain_extremal_selectors" }
category = "bitblast"
help = "FP prepass (enabled by default): replace an objective by necessary semantic {0,1} selector values only after proving their conjunction sufficient (primarily exact extrema)"

[[option]]
name = "fp-domain-sound-zero-facts"
type = "bool"
default = true
tier = "expert"
settable = "before-first-check"
scope = "solver"
engine = { field = "fp_domain_sound_zero_facts" }
category = "bitblast"
help = "Derive sound zero facts from association-safe same-sign boxed +/-1 rows and encode them as zero magnitude bits, preserving the +0/-0 distinction (enabled by default; does not enable --fp-domain-simplify)"

[[option]]
name = "fp-domain-row-bounds"
type = "bool"
default = false
tier = "experimental"
settable = "before-first-check"
scope = "solver"
engine = { field = "fp_domain_row_bounds" }
category = "bitblast"
help = "Experimental FP prepass: recognise linear FP zero rows and rewrite them to false when association-preserving target-format interval endpoints exclude zero"

[[option]]
name = "bb.simplify-during-bb"
type = "bool"
default = false
tier = "experimental"
settable = "before-first-check"
scope = "solver"
engine = { field = "simplify_during_BB_flag" }
category = "bitblast"
excludes = ["disable-opt-inc", "disable-simplifications"]
help = "When bit-blasting discovers that a non-constant child of a term blasts to an all-constant vector, rebuild the term with that constant and re-run the word-level term simplifier on it. Needs the rewriting simplifier, so not with --disable-opt-inc or --disable-simplifications"

[[option]]
name = "aig-node-budget"
type = "int"
default = -1
sentinel = "-1 = no limit; larger than INT_MAX is OPTION_VALUE (the budget could never fire)"
tier = "expert"
settable = "anytime"
scope = "solver"
engine = { field = "aig_node_budget" }
category = "limits"
range = { min = -1, max = 2147483647 }
cli_above_max = "ERROR: --{name} must be at most 2147483647; larger caps can never be reached"
help = "Number of AIG AND gates after which one query's bit-blast gives up. -1 means never, 0 means give up without blasting. Exceeding it abandons the query through the soft-timeout path, so the answer is the one --max-time gives -- \"unknown\" in SMT-LIB mode, with (get-info :reason-unknown) naming this budget, and \"Unknown.\" in the CVC language. Batch solves only: the incremental encoder's AIG outlives the check that grew it and is never capped, so engaging it with a budget set warns once instead. Bounds the blast, not the process -- CNF conversion and the SAT search allocate on top of it"

