engine = { field = "print_nodes_flag" }
category = "output"
help = "print nodes "

[[option]]
name = "cnf-auto-threshold"
type = "uint"
default = 200000
range = { max = 4294967295 }
tier = "expert"
settable = "anytime"
scope = "solver"
engine = { field = "cnf_auto_threshold" }
category = "cnf"
help = "AND-node count at or above which --cnf-generation-effort auto stops minimising: it picks new-medium there and gia-low below, or on the estimate-less fallback drops medium to very-low"

[[option]]
name = "cnf-generation-effort"
type = "enum"
default = "auto"
values = ["auto", "very-low", "low", "medium", "high", "very-high", "new-very-low", "new-low", "new-medium", "new-high", "gia-low", "gia-high", "gia-very-high"]
tier = "stable"
settable = "anytime"
scope = "solver"
engine = { custom = "cnf_generation_effort" }
category = "cnf"
cli_bad_value = "Unknown --cnf-generation-effort value '{value}'. Expected one of: auto, very-low, low, medium, high, very-high, new-very-low, new-low, new-medium, new-high, gia-low, gia-high, gia-very-high."
help = "effort spent minimising the CNF: auto, very-low, low, medium, high, very-high, new-very-low, new-low, new-medium, new-high. Higher is slower to generate but yields a smaller CNF; auto picks gia-low or, for large estimated blasts, new-medium, since minimising a large one costs more than the solver saves - falling back to the very-low/medium choice under array refinement, on solvers other than cadical, or with no estimate recorded. The new-* rungs blast through STP's own AIG instead of ABC's and write the CNF directly: new-very-low is plain Tseitin, new-low recovers XOR and if-then-else, new-medium also collapses n-ary ANDs and ORs. The gia-* rungs are low, high and very-high again, reaching the same generator over a Gia the blaster built rather than one converted from an ABC AIG"

[[option]]
name = "cnf-link-shared-cells"
type = "bool"
default = false
tier = "expert"
settable = "anytime"
scope = "solver"
engine = { field = "cnf_link_shared_cells" }
category = "cnf"
help = "new-* CNF rungs: keep a comparator cell propagation-complete when its exclusive-or is shared, with a linking block beside the exclusive-or's own clauses instead of the per-gate encoding"

[[option]]
name = "cnf-complete-ite"
type = "bool"
default = false
tier = "expert"
settable = "anytime"
scope = "solver"
engine = { field = "cnf_complete_ite" }
category = "cnf"
help = "new-* CNF rungs: encode a recovered if-then-else with all six prime implicates, adding the two that let agreeing arms decide the output while the condition is unset"

[[option]]
name = "incremental"
type = "mode"
cli_form = "flag"
default = "auto"
values = ["on", "off", "auto"]
tier = "stable"
settable = "before-first-check"
scope = "solver"
engine = { custom = "incremental_mode" }
category = "incremental"
help = "whether to solve incrementally -- keeping the SAT solver and the bit-blasted encoding across (check-sat) commands, asserting retractable formulas as SAT assumptions: 'on' (from the first solve, pushes or no pushes), 'off' (never, not even for an input that pushes), or 'auto' (the default: an input that pushes switches it on for itself). A bare --incremental means 'on'; a value must be attached with '=' rather than spelled as a separate argument. SMT-LIB2 only."

[[option]]
name = "incremental-auto-engage-at"
type = "int"
default = -1
range = { min = -1 }
cli_below_min = "ERROR: --{name} must be -1 (theory default), 0 (never), or greater"
sentinel = "-1 = the engine default (3 checks); 0 = never; n = engage at the n-th check"
tier = "stable"
settable = "anytime"
scope = "solver"
engine = { field = "incremental_auto_engage_at" }
category = "incremental"
help = "real-solve ordinal at which an automatically incremental SMT-LIB session engages the persistent driver; -1 uses the theory default (QF_BV/QF_ABV: 32, others: 3), 1 engages on the first solve, and 0 never engages automatically (--incremental=on still engages at 1, and --incremental=off engages never)"

[[option]]
name = "incremental-profile"
type = "bool"
cli_form = "flag"
default = false
tier = "diagnostic"
settable = "anytime"
scope = "solver"
engine = { field = "incremental_profile" }
category = "incremental"
help = "print fine-grained per-check and cumulative timings and work counters for the incremental driver (use with --incremental=on to profile from the first check)"

[[option]]
name = "incremental-core-only"
type = "bool"
cli_form = "flag"
default = false
tier = "experimental"
settable = "before-first-check"
scope = "solver"
engine = { field = "incremental_core_only" }
category = "incremental"
help = "run the minimal persistent assumption/refinement core without fitted preprocessing, promotion, or adaptive backend policies; memory-relief rebuilding remains active"

[[option]]
name = "incremental-cbp-reset"
type = "bool"
cli_form = "flag"
default = false
tier = "diagnostic"
settable = "anytime"
scope = "solver"
engine = { field = "incremental_cbp_reset" }
category = "incremental"
help = "use reset and prefix re-feed instead of CBP level rollback on stack divergence (diagnostic oracle)"

[[option]]
name = "incremental-cbp-bootstrap-limit"
type = "int"
default = 100000
tier = "expert"
settable = "before-first-check"
scope = "solver"
engine = { field = "incremental_cbp_bootstrap_limit" }
category = "incremental"
help = "on a first incremental solve forced by --incremental=on, defer the cross-level CBP bootstrap when the assertion stack exceeds this many DAG nodes. 0 disables the deferral."

[[option]]
name = "incremental-cbp-feed-cap"
type = "int"
default = 200000
range = { min = 1 }
cli_below_min = "ERROR: --{name} must be at least 1"
sentinel = "M:2239-2243"
tier = "expert"
settable = "anytime"
scope = "solver"
engine = { field = "incremental_cbp_feed_cap" }
category = "incremental"
help = "how many DAG nodes the cross-level CBP engine may retain for the live stack before it stops accepting levels; the charge is refunded when a level pops."

[[option]]
name = "incremental-base-resimplify-limit"
type = "int"
default = 100000
range = { min = 0 }
sentinel = "0 = never re-simplify the base"
tier = "expert"
settable = "anytime"
scope = "solver"
engine = { field = "incremental_base_resimplify_limit" }
category = "incremental"
help = "skip the whole-base semantic pass a relief rebuild runs when the base exceeds this many DAG nodes; the raw base is re-encoded instead. 0 always skips it."

[[option]]
name = "incremental-reencode-limit"
type = "int"
default = 1000000
tier = "expert"
settable = "anytime"
scope = "solver"
engine = { field = "incremental_reencode_limit" }
category = "incremental"
help = "rebuild the incremental solver from the live assertion stack once its variable count passes this limit and most encodings belong to popped content. 0 disables the rebuild."

[[option]]
name = "incremental-semantic-cache-limit"
type = "int"
default = 1000000
tier = "expert"
settable = "anytime"
scope = "solver"
engine = { field = "incremental_semantic_cache_limit" }
category = "incremental"
help = "rotate the complete incremental encoding epoch once semantic caches pass this approximate DAG-node charge and an exact retained/live graph check finds mostly popped content. 0 disables this trigger."

[[option]]
name = "incremental-promote-units"
type = "bool"
cli_form = "flag"
default = true
tier = "expert"
settable = "anytime"
scope = "solver"
engine = { field = "incremental_promote_units" }
category = "incremental"
negation = "no-incremental-promote-units"
help = "promote long-stable pushed levels to permanent unit clauses on the incremental driver; retracting a promoted level restarts its solver"

[[option]]
name = "max-num-confl"
aliases = ["max_num_confl"]
short = "g"
type = "int"
default = -1
range = { min = -1 }
sentinel = "-1 = no limit"
tier = "stable"
settable = "anytime"
scope = "solver"
engine = { field = "timeout_max_conflicts" }
category = "limits"
help = "Number of conflicts after which the SAT solver gives up. -1 means never, 0 means give up without searching."

[[option]]
name = "max-time"
aliases = ["max_time"]
short = "k"
type = "duration"
default = "none"
sentinel = "none = no limit; the CLI reads a bare number as seconds, as it always has, the APIs take milliseconds; Python also accepts z3py's `timeout` keyword as an alias"
tier = "stable"
settable = "anytime"
scope = "solver"
engine = { custom = "max_time" }
category = "limits"
help = "Number of seconds after which the SAT solver gives up. The budget is for the whole query, not for each call into the SAT solver. -1 means never, 0 means give up without searching."

[[option]]
name = "check-sanity"
