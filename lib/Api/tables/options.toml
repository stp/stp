# ============================================================================ CLI aliases that map to a value of another entry
# (kept so that existing command lines keep working: each is a bare flag of tools/stp that sets `of` to `value`; the
# flags of one entry exclude each other on the command line)

[[alias]]
name = "cadical"
of = "sat-backend"
value = "cadical"
help = "use cadical as the solver"

[[alias]]
name = "cryptominisat"
of = "sat-backend"
value = "cryptominisat"
help = "use cryptominisat as the solver. Only use CryptoMiniSat 5.0 or above "

[[alias]]
name = "minisat"
of = "sat-backend"
value = "minisat"
help = "use installed minisat version as the solver "

[[alias]]
name = "simplifying-minisat"
of = "sat-backend"
value = "simplifying-minisat"
help = "use installed simplifying minisat version as the solver"

# ============================================================================ frontend-only registrations and their API meaning
# These are not solver options. They exist on the CLI (tools/stp registers them from this section: `cli` is the
# CLI11 spelling list, `kind` is positional | help | flag | bool-option, `group` the --help group) and each names
# the API call that gives a library client the same capability . This is what makes the CLI a
# strict subset of the API. `key` is what tools/stp binds the registration to.

[[frontend]]
key = "file"
cli = "file"
kind = "positional"
help = "input file"
api = "Solver::parse(std::istream&, Format, ParseMode::EXECUTE) over the file (standard input without one), in the format --CVC, --SMTLIB1 or --SMTLIB2 names or else the file's extension: .cvc, .smt, and SMT-LIB 2 for .smt2 and anything else"

[[frontend]]
key = "help"
cli = "--help,-h"
kind = "help"
group = "Most important options"
help = "print this help"
api = "Options::help(); stp::capabilities()"

[[frontend]]
key = "version"
cli = "--version"
kind = "flag"
group = "Most important options"
help = "print version number"
api = "stp::version(); stp::sat_backends() (with per-backend versions in capabilities())"

[[frontend]]
key = "cvc"
cli = "--CVC"
kind = "flag"
group = "Input options"
help = "use the CVC format parser"
api = "the Format argument of Solver::parse / parse_file"

[[frontend]]
key = "smtlib1"
cli = "--SMTLIB1,-m"
kind = "flag"
group = "Input options"
help = "use the SMT-LIB1 format parser"
api = "the Format argument of Solver::parse / parse_file"

[[frontend]]
key = "smtlib2"
cli = "--SMTLIB2"
kind = "flag"
group = "Input options"
help = "use the SMT-LIB2 format parser"
api = "the Format argument of Solver::parse / parse_file"

[[frontend]]
key = "print-stpinput"
cli = "--print-stpinput,-b"
kind = "flag"
group = "Printing options"
help = "print STP input back to cout"
api = "Solver::input_to_string(Format::CVC), or Format::SMTLIB2 for an SMT-LIB 1 input"

[[frontend]]
key = "print-back-cvc"
cli = "--print-back-CVC"
kind = "flag"
group = "Printing options"
help = "print input in CVC format, then exit"
api = "Solver::input_to_string(Format::CVC)"

[[frontend]]
key = "print-back-smtlib2"
cli = "--print-back-SMTLIB2"
kind = "flag"
group = "Printing options"
help = "print input in SMT-LIB2 format, then exit"
api = "Solver::input_to_string(Format::SMTLIB2)"

[[frontend]]
key = "print-back-gdl"
cli = "--print-back-GDL"
kind = "flag"
group = "Printing options"
help = "print AiSee's graph format, then exit"
api = "Solver::input_to_string(Format::GDL)"

[[frontend]]
key = "print-back-dot"
cli = "--print-back-dot"
kind = "flag"
group = "Printing options"
help = "print dotty/neato's graph format, then exit"
api = "Solver::input_to_string(Format::DOT)"

[[frontend]]
key = "print-output"
cli = "--print-output,-n"
kind = "flag"
group = "Printing options"
help = "Print output"
api = "the Result / Entailment object"

[[frontend]]
key = "output-cnf"
cli = "--output-CNF"
kind = "flag"
group = "Output options"
help = "Save the CNF into output_[0..n].cnf. NOTE: variables cannot be mapped back, and problems solved by the preprocessing simplifier alone will not generate any CNF as the SAT solver is never invoked"
api = "Solver::set_cnf_sink: every CNF reaches the caller, which writes the files; the library writes nothing to the working directory"

[[frontend]]
key = "exit-after-cnf"
cli = "--exit-after-CNF"
kind = "flag"
group = "Miscellaneous options"
help = "exit after the CNF has been generated"
api = "Options end-after-cnf: the run ends at the first CNF instead of the process exiting"

[[frontend]]
key = "parse-only"
cli = "--parse-only"
kind = "flag"
group = "Miscellaneous options"
help = "exit after parsing the input, without solving"
api = "ParseMode::PARSE_ONLY: the input is read and nothing is decided"
excludes = ["--output-CNF", "--exit-after-CNF"]

[[frontend]]
key = "interactive"
cli = "--interactive"
kind = "bool-option"
group = "Miscellaneous options"
help = "read the input a character at a time, as needed when driving stp interactively over a pipe. Off reads in blocks, which is faster. Default: on when reading from stdin, off when reading from a file. SMT-LIB2 only."
api = "CLI only: how the binary reads standard input for Solver::parse(std::istream&, ...)"
excludes = ["--CVC", "--SMTLIB1"]

# ============================================================================ in-band SMT-LIB 2 keys and environment taps
# (set-option :produce-models b) writes the registry entry produce-models. The other in-band keys are parser
# state, not solver options: :print-success, :global-declarations, :produce-unsat-assumptions and
# :diagnostic-output-channel are handled by the SMT-LIB 2 frontend of Solver::parse_smt2 (ParseMode::EXECUTE) and
# by tools/stp; an unknown key answers `unsupported`, as SMT-LIB requires. The environment taps STP_DIVMAP,
# STP_SHIFT_ANNOTATE and STP_MULT_ANNOTATE are not options: they are process-wide diagnostics the engine reads
# from the environment and writes to the files they name.

