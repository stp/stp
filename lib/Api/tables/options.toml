# options.toml -- the STP 3.x option registry (design sketch; see DESIGN.md §8).
#
# This file is the single source for options. It generates:
#   - enum class stp::Option / enum stp_option (the "stable" tier only) and the by-name tables for every tier;
#   - Options::set/get/info/names/help in C++, the stp_options_* functions in C, Solver.set(**kw) / Options in Python;
#   - the CLI11 table of tools/stp (every entry's --name, aliases and short form), and its --help text;
#   - the option reference page of the docs;
#   - the parity test: every entry is set through the CLI and through each API, and Options::resolved() is compared.
#
# Provenance of this sketch: the 230 [[option]] entries below were generated from the parity audit's master table
# (../survey/stp-options-parity.md, rows 4-250 minus the frontend rows, the four backend flags and --exit-after-CNF, which
# became aliases), so name, aliases, short
# form, type, default, help and the legacy letter/ordinal come from the audit. Three fields are ASSIGNED BY RULE and
# must be reviewed per entry before implementation:
#   tier      stable | expert | experimental | diagnostic   (rule: an explicit stable list; print-*/verify-* diagnostic;
#             bb.*, fp-domain-*, most lra-* sub-knobs and the finer refinement knobs experimental; the rest expert)
#   settable  anytime | before-first-check | construction   (rule: sat-backend/threads construction; simplification,
#             bit-blasting, cnf, incremental, lra and structural entries before-first-check; limits, model, output and
#             refinement tuning anytime -- the KLEE FP fork changes refinement knobs between checks)
#   category  by name prefix
# Exclusions (the CLI's 37 pairs: 6 vanish inside the sat-backend enum, 3 become threads' `requires`, 4 belong to the frontend rows,
# 24 are `excludes` below), implications (`implied_by`/`follows`/`implies`) and build requirements were transcribed from tools/stp/main.cpp.
#
# Schema
#   name        the canonical key: every language and the CLI (--name) use it; lower-case, hyphenated
#   aliases     other CLI spellings accepted for compatibility (2.x underscores etc.)
#   short       single-letter CLI form
#   type        bool | int | uint | mode | enum | set | string | path | duration
#               mode is the one tri-state auto|on|off (replaces the three 2.x ordinal encodings)
#               set is a set of names (replaces bitmasks); the CLI accepts a comma list, "all" and "none"
#               duration is milliseconds in every API; on the CLI a bare number means seconds (2.x compatibility,
#               fractional allowed) and a suffixed value (500ms, 2s, 1m) is exact
#   default     the value when unset; "none" for duration means no limit
#   range       { min, max } for int/uint
#   values      enum/set members
#   sentinel    the documented meaning of a special value (e.g. "-1 = no limit"); every sentinel is explicit
#   tier        stable | expert | experimental | diagnostic (DESIGN.md §8.1)
#   settable    anytime | before-first-check | construction; a late set is a recoverable OPTION_TIMING error
#   scope       solver | manager
#   category    grouping for help and docs
#   implied_by  { other-option = value }: the value this entry takes when unset and the other option is true
#   follows     "other-option": when unset, takes the value given to the named option (composite switches)
#   negation    the --no-<name> CLI spelling that sets a bool entry to false
#   latched_by  "other-option": while that bool option is true, this entry behaves as before-first-check
#   latch_note  why an entry is before-first-check (the engine site that latches it)
#   implies     for composite switches: what setting this entry writes elsewhere
#   excludes    entries that may not be set together (checked at resolve(), OPTION_CONFLICT)
#   requires    { build = "cadical" | "highs" | "highs-cut-log" | "cryptominisat" | "minisat", option = "...", value = "..." }:
#               OPTION_UNAVAILABLE in other builds; OPTION_CONFLICT when the named option does not hold the value; info().supported = false
#   legacy      { letter, iface_flag, cli_unit }: the 2.x spellings, for MIGRATION.md and the porting guide
#   help        one line, shown by --help and info()

# ============================================================================ new in 3.x

[[option]]
name = "produce-models"
type = "bool"
default = true
tier = "stable"
settable = "anytime"
scope = "solver"
engine = { custom = "produce_models" }
category = "model"
legacy = { letter = "c", note = "2.x: 'c' requested a counterexample without checking it; 'd' checked it and was forced on for every C VC" }
help = "build a model on sat so that Solver::model() is available; off saves the model construction for truth-only clients"

[[option]]
name = "sat-backend"
type = "enum"
default = "auto"
values = ["auto", "cryptominisat", "cadical", "minisat", "simplifying-minisat"]
tier = "stable"
settable = "construction"
scope = "solver"
engine = { custom = "sat_backend" }
category = "sat"
requires = { build = "the named backend; auto picks the first available of cryptominisat, cadical, minisat" }
legacy = { iface_flag = "CMS4 / CADICAL / MS / SMS / MSP", note = "and vc_useCryptominisat/vc_useCadical/vc_useMinisat/vc_useSimplifyingMinisat; the four CLI flags become the aliases below" }
help = "the SAT backend; selecting one this build lacks is a recoverable OPTION_UNAVAILABLE at set time, never exit(-1) at solve time"

[[option]]
name = "random-seed"
type = "uint"
default = 0
tier = "stable"
settable = "before-first-check"
scope = "solver"
engine = { custom = "random_seed" }
category = "sat"
help = "seed for every randomised component (SAT backend, phase and decision heuristics); 2.x had none in the CLI or the API (survey R22)"

[[option]]
name = "model-array-fill"
type = "enum"
default = "zero"
values = ["zero", "ones"]
tier = "stable"
settable = "anytime"
scope = "solver"
engine = { custom = "model_array_fill" }
category = "model"
help = "the element every reader and printer reports for an array cell the model never observed: zero (SMT-LIB (as const) printing) or ones (2.x's read completion without 'x', which KLEE's .ktest bytes depend on)"

[[option]]
name = "stop-after-cnf"
aliases = ["exit-after-CNF"]
type = "bool"
default = false
tier = "expert"
settable = "anytime"
scope = "solver"
engine = { field = "stop_after_cnf" }
category = "cnf"
help = "stop the check after CNF generation and return unknown(STOPPED_AFTER_CNF); 2.x's --exit-after-CNF called exit(0) inside the library"

[[option]]
name = "logic"
type = "string"
default = ""
tier = "stable"
settable = "before-first-check"
scope = "solver"
engine = { custom = "logic" }
category = "frontend"
implies = "QF_UF*/QF_AUF* -> uninterpreted-functions=on; QF_AX -> array-equality=on; QF_BV/QF_ABV -> the 32-check engagement policy; QF_LRA -> every check Real-active (2.x set-logic side effects, now visible through Options::resolved)"
help = "the SMT-LIB logic; the same entry (set-logic) writes when a script is parsed"

[[option]]
name = "simplify"
type = "bool"
default = true
tier = "stable"
settable = "construction"
scope = "manager"
engine = { custom = "manager_simplify" }
category = "manager"
help = "construction-time folding by the term manager (the normal form in kinds.toml); false builds terms faithfully"

[[option]]
name = "default-rounding-mode"
type = "enum"
default = "RNE"
values = ["RNE", "RNA", "RTP", "RTN", "RTZ"]
tier = "stable"
settable = "anytime"
scope = "manager"
engine = { custom = "manager_default_rounding_mode" }
category = "manager"
help = "the rounding mode FP operators use when none is given (C++ and Python operator sugar); the printer always prints it"

# ============================================================================ CLI aliases that map to a value of another entry
# (kept so that 2.x command lines keep working; the generated CLI accepts them and warns once)

[[alias]]
name = "cadical"
of = "sat-backend"
value = "cadical"

[[alias]]
name = "cryptominisat"
of = "sat-backend"
value = "cryptominisat"

[[alias]]
name = "minisat"
of = "sat-backend"
value = "minisat"

[[alias]]
name = "simplifying-minisat"
of = "sat-backend"
value = "simplifying-minisat"

# ============================================================================ frontend-only registrations and their API meaning
# These are not solver options. They exist on the CLI (generated from this section) and each names the API call that
# gives a library client the same capability (DESIGN.md §8.3). This is what makes the CLI a strict subset of the API.

[[frontend]]
cli = "<file>"
api = "Solver::parse_file(path, Format::AUTO)"

[[frontend]]
cli = "--help, -h"
api = "Options::help(); stp::capabilities()"

[[frontend]]
cli = "--version"
api = "stp::version(); stp::sat_backends() (with per-backend versions in capabilities())"

[[frontend]]
cli = "--CVC | --SMTLIB1, -m | --SMTLIB2"
api = "the Format argument of Solver::parse / parse_file"

[[frontend]]
cli = "--parse-only"
api = "ParseMode::DECLARE_AND_ASSERT (the default): a script's check-sat is not executed"
excludes = ["--output-CNF", "--exit-after-CNF"]

[[frontend]]
cli = "--interactive"
api = "CLI only: a REPL that feeds lines to Solver::parse_smt2(text, ParseMode::EXECUTE)"
excludes = ["--CVC", "--SMTLIB1"]

[[frontend]]
cli = "--print-stpinput, -b | --print-back-CVC | --print-back-SMTLIB2 | --print-back-GDL | --print-back-dot"
api = "Solver::to_string(Format::CVC | SMTLIB2 | GDL | DOT); Solver::to_smt2()"

[[frontend]]
cli = "--print-output, -n"
api = "the Result / Entailment object"

[[frontend]]
cli = "--output-CNF"
api = "Solver::write_cnf(std::ostream&); nothing is written to the working directory"

# ============================================================================ in-band SMT-LIB 2 keys and environment taps (SURVEY §6.1 "Beyond argv")
# (set-option :produce-models b) writes the registry entry produce-models. The other 2.x in-band keys are parser
# state, not solver options: :print-success, :global-declarations, :produce-unsat-assumptions and
# :diagnostic-output-channel are handled by the SMT-LIB 2 frontend of Solver::parse_smt2 (ParseMode::EXECUTE) and
# by tools/stp; an unknown key answers `unsupported`, as SMT-LIB requires. The 2.x environment taps STP_DIVMAP,
# STP_SHIFT_ANNOTATE and STP_MULT_ANNOTATE are removed in 3.x (they were latched process-wide diagnostics);
# their output, if still wanted, becomes diagnostic-tier options writing to the diagnostic sink.

