# -*- Python -*-

# Configuration file for the 'lit' test runner.

import os
import sys
import re
import platform

import lit.util
import lit.formats

# name: The name of this test suite.
config.name = 'STP query-files'

# lit's internal shell, unconditionally. A real shell is not an option from
# LLVM-24: lit 23 answers execute_external=True with a deprecation error rather
# than honouring it, and lit 24 removes the parameter. The RUN lines in this
# suite invoke only %solver, %OutputCheck and lit's own `not`, joined by pipes
# and redirections, so nothing here needed a shell that the internal one does
# not provide.
#
# Written without force_execute_external, which lit 23 offers as a migration
# escape hatch but lit 18 has never heard of: rung 1 of the ladder in
# tests/CMakeLists.txt uses whatever lit is already installed, whatever version
# that is, and a config only the newest lit can parse would break it.
# execute_external=False is spelled the same in both.
#
# LIT_USE_INTERNAL_SHELL is no longer read. It selected between the two shells
# and there is only one.

# testFormat: The test format to use to interpret tests.
config.test_format = lit.formats.ShTest(execute_external=False)

# suffixes: A list of file extensions to treat as test files. This is overriden
# by individual lit.local.cfg files in the test subdirectories.
config.suffixes = ['.smt', '.smt2', '.cvc']

# excludes: A list of directories to exclude from the testsuite. The 'Inputs'
# subdirectories contain auxiliary inputs for various tests in their parent
# directories.
config.excludes = ['Inputs']


# The MiniSat backend (and its --minisat/--simplifying-minisat flags) is
# only compiled in when cmake ran with USE_MINISAT. Tests that drive one of
# those flags declare "REQUIRES: minisat".
if getattr(config, 'stp_have_minisat', False):
    config.available_features.add('minisat')

# CaDiCaL-specific incremental policy tests exercise controls that other SAT
# backends deliberately do not expose. The feature says CaDiCaL was compiled
# in, not that it is the backend a run gets: CryptoMiniSat is the default
# wherever it is installed, so these tests have to say --cadical as well.
if getattr(config, 'stp_have_cadical', False):
    config.available_features.add('cadical')

# Retiring probe-based inprocessing needs CaDiCaL's "inprobing" option, which
# is 3.0-and-later. Older CaDiCaLs solve correctly, they just never retire it,
# so only the tests asserting the retirement are gated.
if getattr(config, 'stp_cadical_inprobing', False):
    config.available_features.add('cadical-inprobing')

# test_source_root: The root path where tests are located.
config.test_source_root = os.path.dirname(os.path.abspath(__file__))

# test_exec_root: The root path where tests should be run.
stp_obj_root = getattr(config, 'stp_obj_root', None)
if stp_obj_root is not None:
    config.test_exec_root = os.path.join(stp_obj_root, 'tests', 'query-files')

